spring:
  application:
    name: kim-vyacheslav-student-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/students}
    username: ${DB_USERNAME:student}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
info:
  student: Ким Вячеслав Александрович
